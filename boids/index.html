<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Boids — Flocking Simulation</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05070d;
    overflow: hidden;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    background: #05070d;
    touch-action: none;
  }
  #panel {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 268px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    background: rgba(15, 20, 32, 0.82);
    border: 1px solid rgba(120, 170, 255, 0.18);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #cfe3ff;
    font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    user-select: none;
    z-index: 10;
  }
  #panel.collapsed #panel-body { display: none; }
  #panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(120, 170, 255, 0.14);
  }
  #panel-head .title {
    font-weight: 700;
    letter-spacing: 3px;
    color: #a9ccff;
  }
  #panel-head .title small {
    display: block;
    letter-spacing: 0;
    font-weight: 400;
    color: #6f86a8;
    font-size: 10px;
  }
  #collapse {
    background: rgba(120, 170, 255, 0.12);
    color: #cfe3ff;
    border: 1px solid rgba(120, 170, 255, 0.25);
    border-radius: 6px;
    width: 24px;
    height: 22px;
    cursor: pointer;
    font: inherit;
    line-height: 1;
  }
  #collapse:hover { background: rgba(120, 170, 255, 0.22); }
  #panel-body { padding: 10px 12px 14px; }
  .hint {
    margin: 0 0 10px;
    color: #7f97bb;
    font-size: 11px;
  }
  .section {
    margin: 12px 0 6px;
    color: #6f86a8;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-size: 10px;
  }
  .row {
    display: grid;
    grid-template-columns: 88px 1fr 40px;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
  }
  .row label { color: #b8cced; }
  .row .val {
    text-align: right;
    color: #8fd6ff;
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 4px;
    background: linear-gradient(90deg, #3a63a8, #6fd0ff);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #eaf4ff;
    border: 2px solid #5aa9ff;
    box-shadow: 0 0 6px rgba(90, 169, 255, 0.8);
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #eaf4ff;
    border: 2px solid #5aa9ff;
  }
  .checks {
    display: flex;
    gap: 14px;
    margin: 10px 0 4px;
  }
  .checks label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: #b8cced;
  }
  #reset {
    width: 100%;
    margin-top: 12px;
    padding: 8px;
    cursor: pointer;
    background: rgba(90, 169, 255, 0.16);
    color: #dcecff;
    border: 1px solid rgba(120, 170, 255, 0.35);
    border-radius: 8px;
    font: inherit;
    letter-spacing: 1px;
  }
  #reset:hover { background: rgba(90, 169, 255, 0.28); }
</style>
</head>
<body>
<canvas id="world"></canvas>

<div id="panel">
  <div id="panel-head">
    <span class="title">BOIDS<small>flocking simulation</small></span>
    <button id="collapse" title="Collapse panel">–</button>
  </div>
  <div id="panel-body">
    <p class="hint">Move your mouse to scare the flock.</p>

    <div class="section">Rules</div>
    <div class="row"><label for="separation">Separation</label><input id="separation" data-param="separation" type="range" min="0" max="4" step="0.05" value="1.5"><span class="val" id="separation-v" data-dec="2">0</span></div>
    <div class="row"><label for="alignment">Alignment</label><input id="alignment" data-param="alignment" type="range" min="0" max="4" step="0.05" value="1"><span class="val" id="alignment-v" data-dec="2">0</span></div>
    <div class="row"><label for="cohesion">Cohesion</label><input id="cohesion" data-param="cohesion" type="range" min="0" max="4" step="0.05" value="1"><span class="val" id="cohesion-v" data-dec="2">0</span></div>

    <div class="section">Predator</div>
    <div class="row"><label for="fleeStrength">Flee force</label><input id="fleeStrength" data-param="fleeStrength" type="range" min="0" max="6" step="0.1" value="2.2"><span class="val" id="fleeStrength-v" data-dec="1">0</span></div>
    <div class="row"><label for="fleeRadius">Flee radius</label><input id="fleeRadius" data-param="fleeRadius" type="range" min="0" max="400" step="5" value="140"><span class="val" id="fleeRadius-v" data-dec="0">0</span></div>

    <div class="section">Perception</div>
    <div class="row"><label for="perception">Neighbour</label><input id="perception" data-param="perception" type="range" min="10" max="160" step="1" value="70"><span class="val" id="perception-v" data-dec="0">0</span></div>
    <div class="row"><label for="separationRadius">Sep. radius</label><input id="separationRadius" data-param="separationRadius" type="range" min="0" max="120" step="1" value="28"><span class="val" id="separationRadius-v" data-dec="0">0</span></div>

    <div class="section">Motion</div>
    <div class="row"><label for="maxSpeed">Max speed</label><input id="maxSpeed" data-param="maxSpeed" type="range" min="0.5" max="8" step="0.1" value="3.2"><span class="val" id="maxSpeed-v" data-dec="1">0</span></div>
    <div class="row"><label for="minSpeed">Min speed</label><input id="minSpeed" data-param="minSpeed" type="range" min="0" max="4" step="0.1" value="1.2"><span class="val" id="minSpeed-v" data-dec="1">0</span></div>
    <div class="row"><label for="count">Boid count</label><input id="count" data-param="count" type="range" min="10" max="600" step="10" value="200"><span class="val" id="count-v" data-dec="0">0</span></div>
    <div class="row"><label for="trailFade">Trail fade</label><input id="trailFade" data-param="trailFade" type="range" min="0.02" max="0.6" step="0.01" value="0.14"><span class="val" id="trailFade-v" data-dec="2">0</span></div>

    <div class="checks">
      <label><input type="checkbox" id="pause" data-flag="paused"> Pause</label>
      <label><input type="checkbox" id="grid" data-flag="grid"> Grid</label>
    </div>

    <button id="reset">RESET DEFAULTS</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;
  var BG = "#05070d";

  // ---- Tunable parameters -------------------------------------------------
  var DEFAULTS = {
    count: 200,
    separation: 1.5,
    alignment: 1.0,
    cohesion: 1.0,
    fleeStrength: 2.2,
    fleeRadius: 140,
    perception: 70,
    separationRadius: 28,
    maxSpeed: 3.2,
    minSpeed: 1.2,
    maxForce: 0.08,
    trailFade: 0.14
  };
  var params = {};
  for (var k in DEFAULTS) { params[k] = DEFAULTS[k]; }

  var canvas = document.getElementById("world");
  var ctx = canvas.getContext("2d");
  var width = window.innerWidth;
  var height = window.innerHeight;
  var halfW = width / 2;
  var halfH = height / 2;

  var boids = [];
  var paused = false;
  var showGrid = false;
  var mouse = { x: -9999, y: -9999, active: false };

  // ---- Spatial grid -------------------------------------------------------
  // Uniform hash grid rebuilt every frame. cellSize is the largest query
  // radius we ever use, so a boid only needs to inspect its 3x3 cell block,
  // giving ~O(n * k) neighbour queries instead of O(n^2).
  var grid = new Map();
  var cellSize = 70;
  var cols = 1;
  var rows = 1;

  var outv = [0, 0]; // scratch for steering output (avoids per-frame allocs)
  var scratch = [];  // scratch list of neighbour indices

  function computeGridDims() {
    cellSize = Math.max(params.perception, params.separationRadius, 8);
    cols = Math.max(1, Math.ceil(width / cellSize));
    rows = Math.max(1, Math.ceil(height / cellSize));
  }

  function cellIndex(v) {
    var c = Math.floor(v / cellSize);
    return c < 0 ? 0 : c;
  }

  function buildGrid() {
    computeGridDims();
    grid.clear();
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var gx = cellIndex(b.x); if (gx > cols - 1) gx = cols - 1;
      var gy = cellIndex(b.y); if (gy > rows - 1) gy = rows - 1;
      var key = gx * 4096 + gy;
      var arr = grid.get(key);
      if (!arr) { arr = []; grid.set(key, arr); }
      arr.push(i);
    }
  }

  // ---- Boid model ---------------------------------------------------------
  function spawnBoid() {
    var angle = Math.random() * TAU;
    var speed = params.minSpeed + Math.random() * (params.maxSpeed - params.minSpeed);
    return {
      x: Math.random() * width,
      y: Math.random() * height,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed
    };
  }

  function setCount(n) {
    n = Math.max(1, Math.round(n));
    while (boids.length < n) { boids.push(spawnBoid()); }
    if (boids.length > n) { boids.length = n; }
  }

  // Steer a desired velocity vector toward target by at most maxF.
  // Result is written into outv.
  function steerTo(desX, desY, vx, vy, maxF) {
    var sx = desX - vx;
    var sy = desY - vy;
    var m = Math.sqrt(sx * sx + sy * sy);
    if (m > maxF && m > 0) { var s = maxF / m; sx *= s; sy *= s; }
    outv[0] = sx;
    outv[1] = sy;
  }

  // ---- Physics ------------------------------------------------------------
  function update(dt) {
    var pR = params.perception;
    var pR2 = pR * pR;
    var sR = params.separationRadius;
    var sR2 = sR * sR;
    var maxSpeed = params.maxSpeed;
    var minSpeed = params.minSpeed;
    var maxForce = params.maxForce;
    // Weighted rules are summed then capped at a generous multiple of maxForce
    // so that raising a weight actually strengthens that behaviour.
    var maxAccel = maxForce * 4;

    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];

      // Gather candidate neighbours from the 3x3 cell block (wrapped).
      scratch.length = 0;
      var gx = cellIndex(b.x); if (gx > cols - 1) gx = cols - 1;
      var gy = cellIndex(b.y); if (gy > rows - 1) gy = rows - 1;
      for (var ox = -1; ox <= 1; ox++) {
        var cx = (gx + ox + cols) % cols;
        for (var oy = -1; oy <= 1; oy++) {
          var cy = (gy + oy + rows) % rows;
          var bucket = grid.get(cx * 4096 + cy);
          if (bucket) {
            for (var z = 0; z < bucket.length; z++) { scratch.push(bucket[z]); }
          }
        }
      }

      var sepX = 0, sepY = 0, sepC = 0;
      var aliX = 0, aliY = 0, aliC = 0;
      var cohX = 0, cohY = 0, cohC = 0;

      for (var c = 0; c < scratch.length; c++) {
        var j = scratch[c];
        if (j === i) { continue; }
        var o = boids[j];
        var dx = o.x - b.x;
        var dy = o.y - b.y;
        // minimum-image convention: pick the shortest wrapped offset
        if (dx > halfW) { dx -= width; } else if (dx < -halfW) { dx += width; }
        if (dy > halfH) { dy -= height; } else if (dy < -halfH) { dy += height; }
        var d2 = dx * dx + dy * dy;
        if (d2 < 1e-6) { continue; }

        if (d2 < sR2) {
          // push away: magnitude falls off with distance
          sepX -= dx / d2;
          sepY -= dy / d2;
          sepC++;
        }
        if (d2 < pR2) {
          aliX += o.vx;
          aliY += o.vy;
          aliC++;
          cohX += o.x;
          cohY += o.y;
          cohC++;
        }
      }

      var ax = 0, ay = 0;

      if (sepC > 0) {
        var sLen = Math.sqrt(sepX * sepX + sepY * sepY);
        if (sLen > 0) {
          sepX = sepX / sLen * maxSpeed;
          sepY = sepY / sLen * maxSpeed;
          steerTo(sepX, sepY, b.vx, b.vy, maxForce);
          ax += outv[0] * params.separation;
          ay += outv[1] * params.separation;
        }
      }

      if (aliC > 0) {
        aliX /= aliC; aliY /= aliC;
        var aLen = Math.sqrt(aliX * aliX + aliY * aliY);
        if (aLen > 0) {
          aliX = aliX / aLen * maxSpeed;
          aliY = aliY / aLen * maxSpeed;
          steerTo(aliX, aliY, b.vx, b.vy, maxForce);
          ax += outv[0] * params.alignment;
          ay += outv[1] * params.alignment;
        }
      }

      if (cohC > 0) {
        var cX = cohX / cohC;
        var cY = cohY / cohC;
        var cdx = cX - b.x;
        var cdy = cY - b.y;
        if (cdx > halfW) { cdx -= width; } else if (cdx < -halfW) { cdx += width; }
        if (cdy > halfH) { cdy -= height; } else if (cdy < -halfH) { cdy += height; }
        var cLen = Math.sqrt(cdx * cdx + cdy * cdy);
        if (cLen > 0) {
          cdx = cdx / cLen * maxSpeed;
          cdy = cdy / cLen * maxSpeed;
          steerTo(cdx, cdy, b.vx, b.vy, maxForce);
          ax += outv[0] * params.cohesion;
          ay += outv[1] * params.cohesion;
        }
      }

      // Predator flee: stronger the closer the mouse is.
      if (mouse.active && params.fleeRadius > 0) {
        var pdx = b.x - mouse.x;
        var pdy = b.y - mouse.y;
        if (pdx > halfW) { pdx -= width; } else if (pdx < -halfW) { pdx += width; }
        if (pdy > halfH) { pdy -= height; } else if (pdy < -halfH) { pdy += height; }
        var pd = Math.sqrt(pdx * pdx + pdy * pdy);
        if (pd < params.fleeRadius && pd > 1e-4) {
          var proximity = 1 - pd / params.fleeRadius;
          var fx = pdx / pd * maxSpeed;
          var fy = pdy / pd * maxSpeed;
          steerTo(fx, fy, b.vx, b.vy, maxForce);
          ax += outv[0] * params.fleeStrength * (1 + proximity * 2);
          ay += outv[1] * params.fleeStrength * (1 + proximity * 2);
        }
      }

      // Cap total acceleration.
      var aMag = Math.sqrt(ax * ax + ay * ay);
      if (aMag > maxAccel) { var af = maxAccel / aMag; ax *= af; ay *= af; }

      b.vx += ax * dt;
      b.vy += ay * dt;

      // Clamp speed.
      var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (sp < 1e-6) {
        var ra = Math.random() * TAU;
        b.vx = Math.cos(ra) * minSpeed;
        b.vy = Math.sin(ra) * minSpeed;
      } else if (sp > maxSpeed) {
        var hi = maxSpeed / sp; b.vx *= hi; b.vy *= hi;
      } else if (sp < minSpeed) {
        var lo = minSpeed / sp; b.vx *= lo; b.vy *= lo;
      }

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // Toroidal wrap: keeps the flock on screen without edge steering.
      if (b.x < 0) { b.x += width; } else if (b.x >= width) { b.x -= width; }
      if (b.y < 0) { b.y += height; } else if (b.y >= height) { b.y -= height; }

      // Robustness: recover from any non-finite state.
      if (!isFinite(b.x) || !isFinite(b.y) || !isFinite(b.vx) || !isFinite(b.vy)) {
        boids[i] = spawnBoid();
      }
    }
  }

  // ---- Rendering ----------------------------------------------------------
  function render() {
    // Motion-blur trails: translucent fade instead of a hard clear.
    ctx.fillStyle = "rgba(5,7,13," + params.trailFade + ")";
    ctx.fillRect(0, 0, width, height);

    if (showGrid) {
      ctx.strokeStyle = "rgba(90,140,220,0.16)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var gx = 0; gx <= cols; gx++) {
        var px = Math.round(gx * cellSize) + 0.5;
        ctx.moveTo(px, 0); ctx.lineTo(px, height);
      }
      for (var gy = 0; gy <= rows; gy++) {
        var py = Math.round(gy * cellSize) + 0.5;
        ctx.moveTo(0, py); ctx.lineTo(width, py);
      }
      ctx.stroke();
    }

    var minS = params.minSpeed;
    var maxS = params.maxSpeed;
    var range = maxS - minS;
    if (range < 1e-6) { range = 1; }

    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      var t = (sp - minS) / range;
      if (t < 0) { t = 0; } else if (t > 1) { t = 1; }

      // Hue mapped to speed: slow = cyan/blue, fast = red.
      var hue = 200 - 200 * t;
      var light = 55 + 15 * t;
      ctx.fillStyle = "hsl(" + hue.toFixed(1) + ",85%," + light.toFixed(1) + "%)";

      var ang = Math.atan2(b.vy, b.vx);
      var size = 3.2 + t * 1.8;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(size * 1.9, 0);
      ctx.lineTo(-size, size * 0.95);
      ctx.lineTo(-size, -size * 0.95);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Predator marker.
    if (mouse.active) {
      var pulse = 0.5 + 0.5 * Math.sin(performance.now() / 220);
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 5 + pulse * 4, 0, TAU);
      ctx.strokeStyle = "rgba(255,90,120," + (0.35 + 0.4 * pulse).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // ---- Main loop ----------------------------------------------------------
  var last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) { last = ts; }
    var dt = (ts - last) / 16.6667; // normalise to ~60fps steps
    last = ts;
    if (dt > 3) { dt = 3; } else if (dt < 0) { dt = 0; }

    if (paused) { return; }

    buildGrid();
    update(dt);
    render();
  }

  // ---- Sizing -------------------------------------------------------------
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    halfW = width / 2;
    halfH = height / 2;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, width, height);

    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      if (b.x > width) { b.x = width; }
      if (b.y > height) { b.y = height; }
    }
    computeGridDims();
  }

  // ---- UI wiring ----------------------------------------------------------
  function updateReadout(key) {
    var out = document.getElementById(key + "-v");
    if (!out) { return; }
    var dec = parseInt(out.getAttribute("data-dec") || "0", 10);
    out.textContent = Number(params[key]).toFixed(dec);
  }

  function syncInput(key) {
    var inp = document.getElementById(key);
    if (inp) { inp.value = params[key]; }
    updateReadout(key);
  }

  function bindControls() {
    var sliders = document.querySelectorAll('input[type="range"][data-param]');
    for (var i = 0; i < sliders.length; i++) {
      (function (inp) {
        var key = inp.getAttribute("data-param");
        inp.value = params[key];
        updateReadout(key);
        inp.addEventListener("input", function () {
          params[key] = parseFloat(inp.value);
          if (key === "count") { setCount(params.count); }
          if (key === "maxSpeed" && params.minSpeed > params.maxSpeed) {
            params.minSpeed = params.maxSpeed; syncInput("minSpeed");
          }
          if (key === "minSpeed" && params.minSpeed > params.maxSpeed) {
            params.maxSpeed = params.minSpeed; syncInput("maxSpeed");
          }
          updateReadout(key);
        });
      })(sliders[i]);
    }

    var checks = document.querySelectorAll('input[type="checkbox"][data-flag]');
    for (var j = 0; j < checks.length; j++) {
      (function (inp) {
        inp.addEventListener("change", function () {
          var flag = inp.getAttribute("data-flag");
          if (flag === "paused") { paused = inp.checked; }
          if (flag === "grid") { showGrid = inp.checked; }
        });
      })(checks[j]);
    }

    document.getElementById("reset").addEventListener("click", resetDefaults);

    document.getElementById("collapse").addEventListener("click", function () {
      var panel = document.getElementById("panel");
      panel.classList.toggle("collapsed");
      this.textContent = panel.classList.contains("collapsed") ? "+" : "\u2013";
    });
  }

  function resetDefaults() {
    for (var k in DEFAULTS) { params[k] = DEFAULTS[k]; }
    var sliders = document.querySelectorAll('input[type="range"][data-param]');
    for (var i = 0; i < sliders.length; i++) {
      syncInput(sliders[i].getAttribute("data-param"));
    }
    var checks = document.querySelectorAll('input[type="checkbox"][data-flag]');
    for (var j = 0; j < checks.length; j++) { checks[j].checked = false; }
    paused = false;
    showGrid = false;
    setCount(params.count);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, width, height);
  }

  // ---- Input --------------------------------------------------------------
  function setMouseFromClient(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    mouse.x = clientX - r.left;
    mouse.y = clientY - r.top;
    mouse.active = true;
  }

  window.addEventListener("mousemove", function (e) { setMouseFromClient(e.clientX, e.clientY); });
  window.addEventListener("mouseout", function (e) {
    if (!e.relatedTarget) { mouse.active = false; }
  });
  window.addEventListener("blur", function () { mouse.active = false; });
  canvas.addEventListener("touchstart", function (e) {
    var t = e.touches[0];
    if (t) { setMouseFromClient(t.clientX, t.clientY); }
  }, { passive: true });
  canvas.addEventListener("touchmove", function (e) {
    var t = e.touches[0];
    if (t) { setMouseFromClient(t.clientX, t.clientY); e.preventDefault(); }
  }, { passive: false });
  canvas.addEventListener("touchend", function () { mouse.active = false; });

  // ---- Boot ---------------------------------------------------------------
  window.addEventListener("resize", resize);
  resize();
  setCount(params.count);
  bindControls();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
